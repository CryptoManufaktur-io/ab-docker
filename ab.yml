x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  node:
    build:
      context: ./node
      dockerfile: Dockerfile.binary
      args:
        - AB_VERSION=${AB_VERSION}
        - AB_DEPLOY_VERSION=${AB_DEPLOY_VERSION}
    image: ab-node:local
    pull_policy: build
    container_name: ${PROJECT_NAME}-node
    restart: unless-stopped
    stop_grace_period: 5m
    volumes:
      - ab-data:/data
    environment:
      - NETWORK=${NETWORK:-mainnet}
      - EXTRA_FLAGS=${EXTRA_FLAGS:-}
    ports:
      - ${P2P_PORT:-33333}:33333/tcp
      - ${P2P_PORT:-33333}:33333/udp
    <<: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
          http://localhost:8545 | grep -q '"result"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOCKER_EXT_NETWORK}

      # rpc
      - traefik.http.routers.${RPC_HOST:-ab}.service=${RPC_HOST:-ab}
      - traefik.http.routers.${RPC_HOST:-ab}.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST:-ab}.rule=Host(`${RPC_HOST:-ab}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST:-ab}.tls.certresolver=letsencrypt
      - traefik.http.routers.${RPC_HOST:-ab}lb.service=${RPC_HOST:-ab}
      - traefik.http.routers.${RPC_HOST:-ab}lb.entrypoints=websecure
      - traefik.http.routers.${RPC_HOST:-ab}lb.rule=Host(`${RPC_LB:-ab-lb}.${DOMAIN}`)
      - traefik.http.routers.${RPC_HOST:-ab}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${RPC_HOST:-ab}.loadbalancer.server.port=8545

      # WS
      - traefik.http.routers.${WS_HOST:-abws}.service=${WS_HOST:-abws}
      - traefik.http.routers.${WS_HOST:-abws}.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-abws}.rule=Host(`${WS_HOST:-abws}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-abws}.tls.certresolver=letsencrypt
      - traefik.http.routers.${WS_HOST:-abws}lb.service=${WS_HOST:-abws}
      - traefik.http.routers.${WS_HOST:-abws}lb.entrypoints=websecure
      - traefik.http.routers.${WS_HOST:-abws}lb.rule=Host(`${WS_LB:-abws-lb}.${DOMAIN}`)
      - traefik.http.routers.${WS_HOST:-abws}lb.tls.certresolver=letsencrypt
      - traefik.http.services.${WS_HOST:-abws}.loadbalancer.server.port=8546

      - metrics.scrape=true
      - metrics.port=6060
      - metrics.path=/debug/metrics/prometheus
      - metrics.instance=ab
      - metrics.network=${NETWORK:-mainnet}

volumes:
  ab-data:
